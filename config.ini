# 金融 RAG 项目配置（FinSight 酒研助手）
# 说明：不包含 Docker；以下服务按本机 localhost 已有实例配置
#
# 密码统一走环境变量 / .env，仓库里不存明文：
#   MYSQL_PASSWORD / REDIS_PASSWORD / NEO4J_PASSWORD / DEEPSEEK_API_KEY
# 复制 .env.example 为 .env 后按本机情况填写即可。

[mysql]
host = localhost
user = root
password =
database = finance_qa

[redis]
host = localhost
port = 6379
password =
db = 0

[milvus]
host = localhost
port = 19530
database_name = finance
collection_name = baijiu_annual_report_1006

[llm]
# 当前使用 DeepSeek：模型 deepseek-flash
model = deepseek-flash
# Key / Base URL 优先读系统环境变量 DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL；
# 环境变量缺失时才回退到这里
api_key =
base_url = https://api.deepseek.com
# 旧通义千问（DashScope）配置，保留兼容，不再使用
dashscope_api_key =
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 10
candidate_m = 5
# 是否启用 bge-reranker 重排：CPU 机器上 CrossEncoder 很慢（单次查询可能几十秒），
# 演示/低配机器建议 false；有 GPU 或追求精度时改 true
use_reranker = false
# 金融项目知识库是领域专属的：每个问题都应该先检索年报，不能沿用教育场景的
# “通用知识 -> 直接问 LLM” 分支（那会绕过 RAG 甚至编造）。设为 true 时强制走检索。
always_retrieve = true
# 是否启用 Redis+MySQL FAQ 快路径：金融项目没有 FAQ 题库，且共享 Redis 里可能残留
# 旧项目的 qa_original_questions，必须关掉，否则会拿旧教育客服问题去答白酒问题
enable_fast_path = false
# BM25 关键词召回 + 向量召回 RRF 融合：补“经营风险/渠道库存”这类关键词问题的召回盲区
keyword_retrieval = true
# RAG 回答明确“未找到”时，自动转 LLM 通用回答兜底（加提示，不编造出处）
llm_fallback_on_miss = true

# 财务指标 NL2SQL
[sql]
enabled = true
max_rows = 200

# 语义缓存（BGE-M3 向量缓存：问过的问题直接复用答案，省掉 10-15 秒的检索+生成）
# Redis 连不上时自动降级为进程内内存模式（重启失效，但演示效果一致）
#
# 阈值是实测出来的（scripts/calibrate_cache_threshold.py，真实 BGE-M3 + 12 组问题）：
#   同义改写组最低相似度 0.9068，异指标组最高 0.9302 —— 两者交叉，纯向量阈值不可用。
#   所以向量只做粗筛（0.85），精确判定交给词面重合 + 指标冲突 + 年份冲突三道门槛。
[cache]
semantic_enabled = true
semantic_threshold = 0.85
# 词面重合度门槛（弱门槛）：实测发现它不能当硬门槛——「营收」和「营业收入」
# 分词后不重合，Jaccard 只有 0.33，会误伤最该命中的同义改写
semantic_min_jaccard = 0.2
# 缓存条目有效期（秒）与最大条数
semantic_ttl = 7200
semantic_max_entries = 500
# 每次检索最多比对多少条候选
semantic_candidate_limit = 200

# 股东关系图谱（Neo4j 可选：没安装就保持 enabled = false）
[graph]
enabled = false
backend = neo4j
neo4j_uri = bolt://localhost:7687
neo4j_user = neo4j
neo4j_password =
neo4j_database = neo4j

# 金融数据目录（相对项目根目录）
[finance]
data_dir = data
annual_reports_dir = data/raw/annual_reports
processed_dir = data/processed
companies_file = data/companies.csv
financial_csv = data/structured/financial_indicators.csv
holders_csv = data/structured/holders.csv
index_csv = data/index/annual_report_index.csv

[app]
valid_sources = ["贵州茅台", "五粮液", "泸州老窖", "山西汾酒", "洋河股份", "古井贡酒", "今世缘", "迎驾贡酒", "酒鬼酒", "水井坊", "舍得酒业", "口子窖", "老白干酒", "伊力特", "金徽酒", "顺鑫农业", "天佑德酒", "金种子酒", "皇台酒业", "岩石股份"]
customer_service_phone =

[logger]
log_file = logs/app.log
